server:
  port: ${PORT:8080}          # o Render informa a porta pela variavel PORT
  shutdown: graceful

spring:
  application:
    name: gencand-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5       # o plano gratuito do Neon tem limite de conexoes
      minimum-idle: 1
      connection-timeout: 30000  # o Neon pode levar alguns segundos para acordar
      idle-timeout: 120000
      max-lifetime: 540000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate         # quem altera o banco e o Flyway, nunca o Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC         # datas guardadas em UTC, exibidas no horario de Brasilia

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true            # expoe /actuator/health/liveness, que nao consulta o banco
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}        # minimo de 32 caracteres; nunca no codigo
    expiracao-minutos: 60
  brevo:
    url: https://api.brevo.com/v3/smtp/email
    api-key: ${BREVO_API_KEY}
    remetente-email: ${BREVO_REMETENTE_EMAIL}
    remetente-nome: ${BREVO_REMETENTE_NOME}
