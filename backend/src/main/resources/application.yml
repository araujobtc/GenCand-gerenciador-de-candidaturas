server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gencand-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 120000
      max-lifetime: 540000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: 60
  cors:
    # Informe as origens separadas por vírgula, sem barra no final.
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  brevo:
    url: https://api.brevo.com/v3/smtp/email
    api-key: ${BREVO_API_KEY:}
    remetente-email: ${BREVO_REMETENTE_EMAIL:}
    remetente-nome: ${BREVO_REMETENTE_NOME:GenCand}
